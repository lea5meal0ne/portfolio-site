<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Вход владельца — {{.DB.Settings.Name}}</title><link rel="stylesheet" href="/static/admin.css"></head><body class="login-body"><main class="login-card"><a href="/" class="back">← К портфолио</a><p class="kicker">ЛИЧНАЯ СТУДИЯ</p><h1>Добро пожаловать.</h1><p class="muted">Управление портфолио {{.DB.Settings.Name}}.</p>{{if .Error}}<p class="alert error" role="alert">{{.Error}}</p>{{end}}{{if .Configured}}<form action="/studio/login" method="post"><input type="hidden" name="csrf" value="{{.CSRF}}"><label>Пароль владельца<input type="password" name="password" required autocomplete="current-password" maxlength="1024" autofocus></label><button class="primary" type="submit">Войти в студию ↗</button></form>{{else}}<p class="alert">Вход ещё не настроен. Владелец должен задать пароль при установке сайта.</p>{{end}}</main></body></html>
